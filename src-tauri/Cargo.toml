[package]
name = "Tauri-react-template"
version = "0.1.0"
description = "Tauri + React + Vite template — generic multi-platform (iOS/Android/desktop) with Xcode layers"
authors = ["you"]
edition = "2021"
rust-version = "1.85"

# Package name uses the brand with a capital T (`Tauri-react-template`), so the
# produced binary matches `productName` and the installer on every OS.
[[bin]]
name = "Tauri-react-template"
path = "src/main.rs"

[lib]
name = "Tauri_react_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
# Native-app feel: blocks default browser shortcuts/menus
# (F5, Cmd+R, F12, Ctrl+P/S, zoom, context menu) at the WebView level.
tauri-plugin-prevent-default = "6"
# Generic OS info for frontend (optional, no Keychain). Uncomment if you need
# `platform_info` richer than `platform::current_platform()`.
# tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# Window translucency (macOS vibrancy / Windows Mica).
# NOTE: the crate publishes under the name `window-vibrancy`;
# applies/clears the native material on supported OS (no-op-ish elsewhere).
# NOTE: must stay in the main [dependencies] table (BEFORE any
# [target.'cfg(...)'] section) so it is linked on ALL platforms.
window-vibrancy = "0.8"

# --- Target-specific dependencies ------------------------------------------
# macOS needs no native deps for rounded corners — the native frame
# (decorations:true + transparent + Overlay) draws them at any size.
# Only Windows needs DWMWCP_ROUND for its frameless window.

# Native macOS traffic-light adjustment (lower + grow):
# reaches the window NSButtons via AppKit and edits their frame.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSTimer", "NSRunLoop", "NSString", "NSNotification"] }
block2 = "0.6"
tokio = { version = "1", features = ["rt", "time", "sync"] }

# Windows: Edge/VS Code style overlay titlebar (frameless + own caption
# buttons + Snap Layouts via `show_snap_overlay`) — community plugin.
# Rounded corners: DwmSetWindowAttribute(DWMWA_WINDOW_CORNER_PREFERENCE,
# DWMWCP_ROUND) in lib.rs (a frameless window is square by default).
[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-decorum = "1.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }

# Linux: frameless window (`decorations:false`) with the app-drawn titlebar
# (header + WindowControls); square system corners by design. gtk-rs is only
# needed for `start_window_resize` (edge detection drives `begin_resize_drag`
# — a frameless window gets no WM handles). Same gtk-rs version as tao/wry.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Android: `set_status_bar_style` talks to MainActivity over JNI (see the
# `setStatusBarDark` method in the vendored android template). Versions match
# what wry/tao already pull (Cargo.lock) so the lockfile barely moves.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
await_holding_lock = "deny"
# Style: no .await while holding a Mutex guard.
# Keep to enforce correct async discipline as the template grows.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = false
