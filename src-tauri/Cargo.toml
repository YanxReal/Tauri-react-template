[package]
name = "tauri-react-template"
version = "0.1.0"
description = "Tauri + React + Vite template — generic multi-platform (iOS/Android/desktop) with Xcode layers"
authors = ["you"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "tauri_react_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
# Native-app feel: bloquea atajos/menús predeterminados del navegador
# (F5, Cmd+R, F12, Ctrl+P/S, zoom, menú contexto) a nivel de WebView.
tauri-plugin-prevent-default = "2"
# Generic OS info for frontend (optional, no Keychain). Uncomment if you need
# `platform_info` richer than `platform::current_platform()`.
# tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# Window translucency (macOS vibrancy / Windows Mica) — "efecto cristal".
# Prestly pattern: the crate publishes under the name `window-vibrancy`;
# applies/clears the native material on supported OS (no-op-ish elsewhere).
# NOTE: must stay in the main [dependencies] table (BEFORE any
# [target.'cfg(...)'] section) so it is linked on ALL platforms.
window-vibrancy = "0.8"

# --- Target-specific dependencies ------------------------------------------
# macOS NO necesita deps nativas para esquinas redondeadas — el marco
# nativo (decorations:true + transparent + Overlay) las dibuja a cualquier
# tamaño. Solo Windows necesita DWMWCP_ROUND para el frameless.

# Ajuste de los traffic lights nativos de macOS ("bajarlos / agrandarlos"):
# se accede a los NSButton de la ventana vía AppKit y se modifica su frame.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSTimer", "NSRunLoop", "NSString", "NSNotification"] }
block2 = "0.6"
tokio = { version = "1", features = ["rt", "time", "sync"] }

# Esquinas redondeadas nativas en Windows 11 (preferencia DWM). Prestly usa
# DwmSetWindowAttribute(DWMWA_WINDOW_CORNER_PREFERENCE, DWMWCP_ROUND) en
# windows[0] — solo para target Windows (WS_POPUP es cuadrado por defecto).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
await_holding_lock = "deny"
# Prestly style: no .await while holding a Mutex guard.
# Keep to enforce correct async discipline as the template grows.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = false
