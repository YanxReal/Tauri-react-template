[package]
name = "tauri-react-template"
version = "0.1.0"
description = "Tauri + React + Vite template with Tailwind v4, Biome and i18n"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_react_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
