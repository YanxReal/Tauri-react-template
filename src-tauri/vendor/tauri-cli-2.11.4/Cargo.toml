[package]
edition = "2021"
rust-version = "1.77.2"
name = "tauri-cli"
version = "2.11.4"
authors = ["Tauri Programme within The Commons Conservancy"]
build = "build.rs"
include = [
    "src/",
    "/templates",
    "scripts/",
    "*.json",
    "*.rs",
    "tauri.gitignore",
    "tauri-dev-watcher.gitignore",
    "LICENSE*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Command line interface for building Tauri apps"
homepage = "https://tauri.app"
readme = "README.md"
categories = [
    "gui",
    "web-programming",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tauri-apps/tauri"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/tauri-cli-v{ version }/cargo-tauri-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-fmt = "zip"

[features]
default = [
    "rustls",
    "platform-certs",
]
native-tls = [
    "tauri-bundler/native-tls",
    "cargo-mobile2/native-tls",
    "ureq/native-tls",
]
native-tls-vendored = [
    "native-tls",
    "tauri-bundler/native-tls-vendored",
]
platform-certs = [
    "tauri-bundler/platform-certs",
    "ureq/platform-verifier",
]
rustls = [
    "tauri-bundler/rustls",
    "cargo-mobile2/rustls",
    "ureq/rustls",
]

[lib]
name = "tauri_cli"
path = "src/lib.rs"

[[bin]]
name = "cargo-tauri"
path = "src/main.rs"

