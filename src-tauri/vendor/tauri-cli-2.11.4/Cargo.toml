# Local fix: Xcode 26 devicectl lists iOS Simulators; cargo-mobile2 must not
# treat them as physical devices. Vendored patched copy lives alongside this
# crate. Build IN PLACE (make install-tauri-cli) — `cargo install --path` copies
# the package to a temp dir, which would break this relative path.
[patch.crates-io]
