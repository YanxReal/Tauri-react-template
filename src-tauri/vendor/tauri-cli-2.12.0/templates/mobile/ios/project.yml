# Prestly unified Apple target — ONE target (`{{app.name}}_Apple`), TWO
# destinations (iOS/iPhoneSimulator + macOS). Everything that differs
# between the platforms lives in `apple.xcconfig` ([sdk=...] conditionals)
# and the platform branch inside the "Build Rust Code" phase.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ RULE: NEVER edit {{app.name}}.xcodeproj directly. The whole gen/ folder │
# │ is gitignored — it does NOT persist on GitHub and can be wiped at any   │
# │ time. The source of truth is THIS file (vendored template:              │
# │ src-tauri/vendor/tauri-cli-2.12.0/templates/mobile/ios/project.yml)     │
# │ + apple.xcconfig. After any change to the TEMPLATE, reinstall the CLI   │
# │ and re-init; after any change to the OUTPUT only, regenerate:           │
# │                                                                         │
# │     cd gen/apple && xcodegen generate                                   │
# └─────────────────────────────────────────────────────────────────────────┘
name: {{app.name}}
options:
  bundleIdPrefix: {{app.identifier}}
  deploymentTarget:
    iOS: {{apple.ios-version}}
fileGroups: [{{join file-groups}}, apple.xcconfig]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: {{app.stylized-name}}
      PRODUCT_BUNDLE_IDENTIFIER: {{app.identifier}}
      {{#if apple.development-team}}
      DEVELOPMENT_TEAM: {{apple.development-team}}
      {{/if}}
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  {{app.name}}_Apple:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # `Externals` holds the compiled `{{ lib-output-file-name }}` static library
      # per platform/arch (Externals/<arch|macosx>/<config>). It must NOT be
      # listed here: XcodeGen would scan it and add a "Copy Bundle Resources"
      # phase for every `.a` found, making the build fail with "Multiple
      # commands produce .../libapp.a". The library is linked through the
      # apple.xcconfig flags (-lapp + LIBRARY_SEARCH_PATHS).
      - path: {{app.name}}_Apple
      - path: {{app.asset-dir}}
        buildPhase: resources
        type: folder
      {{~#each asset-catalogs}}
      - {{prefix-path this}}{{/each}}
      {{~#each ios-additional-targets}}
      - path: {{prefix-path this}}{{/each}}
      - path: LaunchScreen.storyboard
      - path: ../../icons/icon.icns
        buildPhase: resources
    info:
      path: {{app.name}}_Apple/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        # UIKit scene-based lifecycle is required when building with the iOS 27 SDK
        # (Technote TN3187); without it the app traps at launch with
        # `_UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption`.
        # tao enables its scene support when UIApplicationSupportsMultipleScenes is true,
        # registers `application(_:configurationForConnecting:options:)` on its AppDelegate
        # and attaches windows to the first connected scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: TaoScene
                UISceneDelegateClassName: TaoSceneDelegate
        # Bundle id is the repository-wide identifier (tauri.conf.json > identifier).
        # Local network access is required on iOS 14+; without
        # NSLocalNetworkUsageDescription the app aborts on the first LAN connection.
        # Needed e.g. to reach the Vite dev server from a physical device during
        # `tauri ios dev`.
        NSLocalNetworkUsageDescription: Prestly uses the local network to communicate with devices and services in your workspace.
        # ATS blocks plain-HTTP loads to LAN addresses; NSAllowsLocalNetworking
        # relaxes ATS for local-network hosts only (e.g. the dev server's LAN IP
        # or the USB link-local 169.254.x.x address) without disabling ATS for
        # arbitrary internet hosts.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: {{apple.bundle-version-short}}
        CFBundleVersion: "{{apple.bundle-version}}"
        {{~#each apple.plist-pairs}}
        {{this.key}}: {{this.value}}{{/each}}
        # ---- macOS-only keys (ignored by iOS) ----
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.finance
        CFBundleIconName: AppIcon
        # Static scheme registration is MANDATORY inside the App Sandbox:
        # the deep-link plugin's runtime registration
        # (LSSetDefaultHandlerForURLScheme) silently no-ops when sandboxed,
        # so prestly:// recovery links only land here via CFBundleURLTypes.
        CFBundleURLTypes:
          - CFBundleURLName: com.yanxstudio.prestly
            CFBundleURLSchemes: [prestly]
    # Per-platform entitlements (static files, see apple.xcconfig):
    # macos.entitlements carries the App Sandbox + network.client +
    # keychain-access-groups required for Mac App Store distribution;
    # ios.entitlements carries the Keychain group only. The XcodeGen
    # `entitlements:` block is deliberately NOT used — it would inject ONE
    # unconditional CODE_SIGN_ENTITLEMENTS that overrides the [sdk=...]
    # conditionals in apple.xcconfig.
    configFiles:
      debug: apple.xcconfig
      release: apple.xcconfig
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
      {{~#if ios-command-line-arguments}}
      commandLineArguments:
      {{~#each ios-command-line-arguments}}
        "{{this}}": true
      {{/each}}{{~/if}}
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [{{join ios-valid-archs}}]
        VALID_ARCHS: {{~#each ios-valid-archs}} {{this}} {{/each}}
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        ALWAYS_SEARCH_USER_PATHS: NO
        USE_HEADERMAP: YES
      groups: [app]
    preBuildScripts:
      # Xcode runs script phases with its own minimal PATH (no ~/.cargo/bin,
      # no /opt/homebrew/bin), so rustup-managed toolchains make `cargo`
      # unresolvable ("cargo: command not found") and Homebrew-managed
      # frontend tooling makes `yarn` unresolvable. Export both here,
      # mirroring cargo-mobile2's own template.
      #
      # Standalone IDE builds (no `tauri ios dev|build` parent) are
      # self-sufficient: Release runs the frontend production build
      # (`yarn build`, the CLI's beforeBuildCommand does not run from Xcode),
      # while Debug opens a visible Terminal window running the Vite dev
      # server (web-app/scripts/ios-dev-server.command, devUrl
      # localhost:43422) when it is not already listening, so HMR works with
      # visible logs; closing the window stops the server.
      #
      # Platform split: macosx compiles the crate as a host staticlib and
      # stages it as Externals/macosx/<config>/libapp.a (Release embeds the
      # built frontend via tauri/custom-protocol); every other platform goes
      # through the cargo-mobile2 pipeline unchanged.
      - script: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          if [ "$PLATFORM_NAME" = "macosx" ]; then
            if [ "$CONFIGURATION" = "release" ]; then
              (cd "$SRCROOT/../../../web-app" && yarn build) || exit 1
              cargo build --manifest-path "$SRCROOT/../../Cargo.toml" --lib --release --features tauri/custom-protocol || exit 1
              LIB="$SRCROOT/../../target/release/libprestly_lib.a"
            else
              if ! curl -sf http://localhost:43422 >/dev/null 2>&1; then
                open -a Terminal "$SRCROOT/../../../web-app/scripts/ios-dev-server.command"
              fi
              cargo build --manifest-path "$SRCROOT/../../Cargo.toml" --lib || exit 1
              LIB="$SRCROOT/../../target/debug/libprestly_lib.a"
            fi
            mkdir -p "$SRCROOT/Externals/macosx/$CONFIGURATION"
            cp -f "$LIB" "$SRCROOT/Externals/macosx/$CONFIGURATION/{{ lib-output-file-name }}"
          else
            if [ "$CONFIGURATION" = "release" ]; then
              (cd "$SRCROOT/../../../web-app" && yarn build) || exit 1
            elif ! curl -sf http://localhost:43422 >/dev/null 2>&1; then
              open -a Terminal "$SRCROOT/../../../web-app/scripts/ios-dev-server.command"
            fi
            {{ shell-escape tauri-binary }} {{ tauri-binary-args-str }} -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
          fi
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/{{ lib-output-file-name }}
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/{{ lib-output-file-name }}
          - $(SRCROOT)/Externals/macosx/${CONFIGURATION}/{{ lib-output-file-name }}
    {{~#if ios-post-compile-scripts}}
    postCompileScripts:
      {{~#each ios-post-compile-scripts}}{{#if this.path}}
      - path {{this.path}}{{/if}}{{#if this.script}}
      - script: {{this.script}}{{/if}}{{#if this.name}}
        name: {{this.name}}{{/if}}{{#if this.input-files}}
        inputFiles: {{~#each this.input-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-files}}
        outputFileLists: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.input-file-lists}}
        inputFileLists: {{~#each this.input-file-lists}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-file-lists}}
        outputFileLists: {{~#each this.output-file-lists}}
          - {{this}}{{/each}}{{/if}}{{#if this.shell}}
        shell: {{this.shell}}{{/if}}{{#if this.show-env-vars}}
        showEnvVars: {{this.show_env_vars}}{{/if}}{{#if this.run-only-when-installing}}
        runOnlyWhenInstalling: {{this.run-only-when-installing}}{{/if}}{{#if this.based-on-dependency-analysis}}
        basedOnDependencyAnalysis: {{this.based-on-dependency-analysis}}{{/if}}{{#if this.discovered-dependency-file}}
        discoveredDependencyFile: {{this.discovered-dependency-file}}{{/if}}
      {{~/each~}}
    {{~/if~}}
    {{~#if ios-post-build-scripts}}
    postBuildScripts:
      {{~#each ios-post-build-scripts}}{{#if this.path}}
      - path {{this.path}}{{/if}}{{#if this.script}}
      - script: {{this.script}}{{/if}}{{#if this.name}}
        name: {{this.name}}{{/if}}{{#if this.input-files}}
        inputFiles: {{~#each this.input-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-files}}
        outputFiles: {{~#each this.output-files}}
          - {{this}}{{/each}}{{/if}}{{#if this.input-file-lists}}
        inputFileLists: {{~#each this.input-file-lists}}
          - {{this}}{{/each}}{{/if}}{{#if this.output-file-lists}}
        outputFileLists: {{~#each this.output-file-lists}}
          - {{this}}{{/each}}{{/if}}{{#if this.shell}}
        shell: {{this.shell}}{{/if}}{{#if this.show-env-vars}}
        showEnvVars: {{this.show_env_vars}}{{/if}}{{#if this.run-only-when-installing}}
        runOnlyWhenInstalling: {{this.run-only-when-installing}}{{/if}}{{#if this.based-on-dependency-analysis}}
        basedOnDependencyAnalysis: {{this.based-on-dependency-analysis}}{{/if}}{{#if this.discovered-dependency-file}}
        discoveredDependencyFile: {{this.discovered-dependency-file}}{{/if}}
      {{~/each~}}
    {{~/if}}
