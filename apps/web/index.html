<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Tauri + React + Vite template — fast, typed, accessible. Plantilla Tauri + React + Vite rápida, tipada y accesible."
    />
    <meta property="og:title" content="Tauri React Template" />
    <meta
      property="og:description"
      content="Bilingual Tauri v2 + React 19 + Vite + Tailwind v4 starter. Starter bilingüe."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Tauri React Template</title>
    <!-- Pre-hydration theme: set the stored/system theme class before the
         bundle paints (the ThemeProvider re-applies the same logic at mount;
         keep both in sync — storageKey "theme" lives in theme-provider.tsx). -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme") || "system"
          const dark =
            stored === "dark" ||
            (stored === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add(dark ? "dark" : "light")
        } catch {
          /* no storage (private mode): ThemeProvider still applies the class */
        }
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app. / Necesitas habilitar JavaScript para ejecutar esta app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
