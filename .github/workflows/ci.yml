name: CI — weekly gates (free-tier friendly)

# The repo runs its gates LOCALLY by design; this workflow only guards the
# baseline once a week (and on manual dispatch) so free-tier minutes stay ~0.
# NO push/pull_request triggers on purpose. The jobs never run ad-hoc build
# commands: they only call Makefile targets (`make ci-frontend` / `make
# ci-rust`). Mobile (iOS/Android) and native Tauri bundles stay OUT of CI —
# that 5-OS pipeline runs on the maintainer's machine / Linux box.
on:
  schedule:
    - cron: "0 18 * * 1" # Monday 18:00 UTC (14:00 EDT)
  workflow_dispatch: # manual runs any time

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make ci-frontend

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: make ci-rust